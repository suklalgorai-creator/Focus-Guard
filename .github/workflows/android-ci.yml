name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, Unit Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble Release APK (R8 / ProGuard check)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: focus-guard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK (Unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: focus-guard-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-guard-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-guard-lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  security-checks:
    name: Security & Manifest Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review (Pull Requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Static Android Security Checks
        run: |
          set -euo pipefail
          echo "Checking AndroidManifest.xml security attributes..."
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' app/src/main/AndroidManifest.xml
          grep -q 'android:permission="com.focusguard.app.permission.SYNC_STUDYFLOW"' app/src/main/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml

          echo "Checking for cleartext HTTP URLs in main Kotlin sources..."
          if grep -rn "http://" app/src/main/java/; then
            echo "ERROR: Cleartext http:// URL found in app/src/main/java/"
            exit 1
          fi

          echo "Checking for service_role secrets in repository..."
          if grep -rn "service_role" app/src/; then
            echo "ERROR: Potential Supabase service_role key reference found in app/src/"
            exit 1
          fi

          echo "All static security checks passed."
